<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canva Bulk PPTX Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Canva Bulk PPTX</h1>
      <span id="badge" class="badge">Stopped</span>
    </header>

    <p id="reason" class="reason" hidden></p>

    <section class="numbers">
      <div><b id="n-queued">0</b><span>waiting</span></div>
      <div><b id="n-done">0</b><span>saved</span></div>
      <div><b id="n-skipped">0</b><span>skipped</span></div>
      <div><b id="n-failed">0</b><span>failed</span></div>
    </section>
    <p id="eta" class="muted"></p>
    <p id="today" class="muted"></p>

    <div class="buttons">
      <button id="start" class="main">Start</button>
      <button id="pause">Pause</button>
      <button id="zip">Make ZIP now</button>
      <button id="retry">Retry failed</button>
      <button id="clear">Clear saved</button>
      <button id="options">Settings</button>
      <button id="debug">Copy debug info</button>
    </div>

    <details>
      <summary>Paste template links</summary>
      <textarea id="links" rows="5" placeholder="One Canva template link per line"></textarea>
      <button id="add">Add to queue</button>
      <p id="add-msg" class="muted"></p>
    </details>

    <h2>Queue</h2>
    <ul id="list"></ul>

    <script src="popup.js" type="module"></script>
  </body>
</html>
